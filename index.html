<style>

body{
    font-family:system-ui,sans-serif;
    background:#0f172a;
    color:white;
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:24px;
    margin-top:15px;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.start-btn{
    width:100%;
    padding:15px;
    margin-top:15px;

    background:#22c55e;
    color:white;

    font-size:18px;
    font-weight:700;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
}

.score-card{
    text-align:center;
    background:#334155;
    padding:15px;
    border-radius:16px;
}

.score-name{
    font-weight:700;
    margin-bottom:8px;
}

.score-value{
    font-size:42px;
    font-weight:900;
}

.word{
    background:white;
    color:#4f46e5;

    font-size:42px;
    font-weight:900;

    text-align:center;

    padding:25px;
    border-radius:18px;

    margin-top:15px;
    margin-bottom:15px;

    word-break:break-word;
}

.score-btn{
    width:100%;
    padding:15px;
    margin-top:10px;

    font-size:18px;
    font-weight:700;
}

.p1{
    background:#22c55e;
    color:white;
}

.p2{
    background:#3b82f6;
    color:white;
}

.new-word-btn{
    width:100%;

    padding:24px;

    margin-top:20px;

    background:#facc15;
    color:#111827;

    font-size:30px;
    font-weight:900;

    box-shadow:
        0 8px 20px rgba(250,204,21,.35);
}

.new-word-btn:hover{
    transform:translateY(-2px);
}

.new-word-btn:active{
    transform:scale(.98);
}

#winnerBanner{
    display:none;

    margin-top:20px;

    background:#facc15;
    color:#111827;

    padding:20px;

    border-radius:16px;

    text-align:center;

    font-size:28px;
    font-weight:900;
}

/* FIXED HISTORY BOX */

#history{
    height:120px;
    max-height:120px;

    overflow-y:auto;
    overflow-x:hidden;

    margin-top:15px;
    padding:12px;

    background:#0b1430;

    border:1px solid #334155;
    border-radius:16px;

    box-sizing:border-box;
}

.history-item{
    padding:6px 0;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    font-size:14px;
}

.history-item:last-child{
    border-bottom:none;
}

.hidden{
    display:none;
}

@media (max-width:600px){

    .score-value{
        font-size:32px;
    }

    .word{
        font-size:32px;
    }

    .new-word-btn{
        font-size:24px;
        padding:20px;
    }
}

</style>
