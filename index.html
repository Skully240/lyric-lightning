<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>⚡ Lyric Lightning</title>

<link rel="manifest" href="manifest.json">

body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:system-ui,sans-serif;
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-top:15px;
}

input,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    box-sizing:border-box;
    margin-top:10px;
}

button{
    border:none;
    cursor:pointer;
}

.start-btn{
    width:100%;
    padding:16px;
    margin-top:15px;
    background:#22c55e;
    color:white;
    border-radius:12px;
    font-size:18px;
    font-weight:700;
}

.hidden{
    display:none;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.score-card{
    background:#334155;
    padding:15px;
    border-radius:16px;
    text-align:center;
}

.score-name{
    font-weight:bold;
}

.score-value{
    font-size:42px;
    font-weight:900;
}

.timer{
    text-align:center;
    font-size:56px;
    font-weight:900;
    margin:20px 0;
}

.word{
    background:white;
    color:#4f46e5;
    border-radius:16px;
    padding:20px;
    text-align:center;
    font-size:42px;
    font-weight:900;
    margin-top:15px;
}

.button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.score-btn{
