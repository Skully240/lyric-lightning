<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>⚡ Lyric Lightning</title>

<link rel="manifest" href="manifest.json">

<style>

body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:system-ui,sans-serif;
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    margin-top:15px;
}

input,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    box-sizing:border-box;
    margin-top:10px;
}

button{
    border:none;
    cursor:pointer;
}

.start-btn{
    width:100%;
    padding:16px;
    margin-top:15px;
    background:#22c55e;
    color:white;
    border-radius:12px;
    font-size:18px;
    font-weight:700;
}

.hidden{
    display:none;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.score-card{
    background:#334155;
    padding:15px;
    border-radius:16px;
    text-align:center;
}

.score-name{
    font-weight:bold;
}

.score-value{
    font-size:42px;
    font-weight:900;
}

.timer{
    text-align:center;
    font-size:56px;
    font-weight:900;
    margin:20px 0;
}

.word{
    background:white;
    color:#4f46e5;
    border-radius:16px;
    padding:20px;
    text-align:center;
    font-size:42px;
    font-weight:900;
    margin-top:15px;
}

.button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.score-btn{
    width:100%;
    padding:16px;
    font-size:18px;
    font-weight:700;
    border-radius:12px;
}

.p1{
    background:#22c55e;
    color:white;
}

.p2{
    background:#3b82f6;
    color:white;
}

.new-word-btn{
    position:sticky;
    bottom:10px;
    z-index:999;
    width:100%;
    padding:24px;
    margin-top:20px;
    background:#facc15;
    color:#111827;
    border-radius:18px;
    font-size:30px;
    font-weight:900;
}

.history-title{
    margin-top:20px;
    margin-bottom:10px;
}

#history{
    height:120px;
    overflow-y:auto;
    padding:12px;
    background:#0b1430;
    border:1px solid #334155;
    border-radius:16px;
}

.history-item{
    padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.history-item:last-child{
    border-bottom:none;
}

#winnerBanner{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#facc15;
    color:#111827;
    border-radius:16px;
    text-align:center;
}
    startBtn.addEventListener(
    "click",
    () => {

        resetGame();

        document
            .getElementById(
                "setupCard"
            )
            .style.display =
            "block";

        game.classList.remove(
            "hidden"
        );

        player1Name.textContent =
            p1Input.value;

        player2Name.textContent =
            p2Input.value;

        p1Point.textContent =
            `✅ ${p1Input.value} Got It`;

        p2Point.textContent =
            `✅ ${p2Input.value} Got It`;
    }
);

@media(max-width:600px){

    .word{
        font-size:32px;
    }

    .timer{
        font-size:42px;
    }

    .new-word-btn{
        font-size:24px;
    }

    .button-row{
        gap:8px;
    }

    .score-btn{
        font-size:15px;
        padding:14px 8px;
    }
}

</style>
</head>

<body>

<h1>⚡ LYRIC LIGHTNING ⚡</h1>

<div id="setupCard" class="card">

    <input id="p1" value="Alex">
    <input id="p2" value="Jordan">

    <button id="start" class="start-btn">
        🚀 START GAME
    </button>

</div>

<div id="game" class="card hidden">

    <div class="scoreboard">

        <div class="score-card">
            <div id="player1Name" class="score-name">
                Alex
            </div>

            <div id="score1" class="score-value">
                0
            </div>
        </div>

        <div class="score-card">
            <div id="player2Name" class="score-name">
                Jordan
            </div>

            <div id="score2" class="score-value">
                0
            </div>
        </div>

    </div>

    <select id="cat"></select>

    <select id="difficulty">
        <option value="30">🟢 Easy (30s)</option>
        <option value="20" selected>🟡 Medium (20s)</option>
        <option value="10">🔴 Hard (10s)</option>
    </select>

    <div id="timerDisplay" class="timer">
        20
    </div>

    <div id="word" class="word">
        READY
    </div>

    <div class="button-row">

        <button id="p1Point" class="score-btn p1">
            ✅ Player 1 Got It
        </button>

        <button id="p2Point" class="score-btn p2">
            ✅ Player 2 Got It
        </button>

    </div>

    <button id="newWord" class="new-word-btn">
        🎲 NEW WORD
    </button>

    <div class="history-title">
        Recent Words
    </div>

    <div id="history"></div>

    <div id="winnerBanner"></div>

</div>

<script src="app.js"></script>

</body>
</html>
